# Rung 1. Still a tiny NCM: L=64, six residual levels, codebook 256, embed 64,
# generator 2 layers of width 64. Pretok is UTF-8 bytes padded to 320, not
# MiniMind's trained 6400-token vocab and not GPT-2.
name: NCM-MiniMind-iWSP-pilot
seed: 0

pretok:
  kind: byte
  pad_vocab_to: 320

tokenizer:
  embed_dim: 64
  context_length: 64
  n_heads: 4
  dropout: 0.1
  enc_layers: 0
  dec_layers: 1
  use_qk_norm: true
  pre_quant_groupnorm: 8
  codebook_size: 256
  levels: [1, 4, 8, 16, 32, 64]
  learned_l1_sampling: true
  learned_l1_cascade: true
  learned_l1_cascade_base: 4
  quant_resi:
    enabled: true
    ratio: 0.5

generator:
  n_layer: 2
  n_head: 4
  n_embd: 64
  bias: true
  dropout: 0.1
  prefix_len: 1
  rope_base: 100000
  use_rope: true
  use_level_encoding: true
  use_qk_norm: true
  attn_pattern: block_diagonal
  predict_level0: false

data:
  hidden_pct: 1
  visible_pct: 1
  max_windows: 256

eval:
  batch_size: 4
  max_windows: 32
  n_generate: 2
